<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#790e16">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Preencher dossiê | Maximum Contábil</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dossier.css">
  <script type="module" src="/dossier-public.js"></script>
</head>
<body class="dossier-public">
  <a class="skip-link" href="#dossierMain">Ir para o conteúdo</a>
  <header class="dossier-public-bar">
    <div class="dossier-public-brand">
      <img src="/maximum-logo.png" width="512" height="107" alt="Maximum Assessoria Contábil">
    </div>
    <span>Dossiê empresarial</span>
  </header>
  <main id="dossierMain" tabindex="-1" class="dossier-public-main">
    <header class="dossier-page-head">
      <div>
        <p class="eyebrow">Sucesso do Cliente</p>
        <h1>Preencher dossiê</h1>
        <p>Informe os dados da empresa para preparar o início do atendimento pela Maximum.</p>
      </div>
    </header>
    <section class="dossier-card dossier-public-card">
      <div id="dossierPublicStatus" class="dossier-message" role="status">Validando o link…</div>
      <div id="dossierPublicForm" hidden></div>
      <button class="dossier-button" id="dossierPublicRetry" type="button" hidden>Tentar novamente</button>
      <noscript><p>Ative o JavaScript para preencher o dossiê.</p></noscript>
    </section>
  </main>
</body>
</html>
